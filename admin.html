<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Master Admin</title>
    <style>
        :root { --bg: #0b0e14; --card: #161b26; --green: #43a047; --red: #e53935; --text: #fff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; }
        h2 { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .status { font-size: 1.1rem; margin: 20px 0; color: #64b5f6; font-weight: bold; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-crash { background: var(--red); width: 100%; padding: 18px; font-size: 1.2rem; margin-top: 15px; }
        .btn-approve { background: var(--green); }
        .btn-reject { background: var(--red); }
        .req-item { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .req-info { font-size: 0.85rem; line-height: 1.4; }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px; color: #e53935;">✈️ AVIATOR MASTER ADMIN PANEL</h1>

    <div class="grid">
        <div class="card" style="text-align: center;">
            <h2>ইনস্ট্যান্ট গেম কন্ট্রোল</h2>
            <div class="status" id="admin-status">সার্ভার প্রস্তুত (অটো-লুপ সক্রিয়)</div>
            <button class="btn btn-crash" id="force-crash-btn">🔥 FORCE CRASH NOW</button>
        </div>

        <div class="card">
            <h2>ডিপোজিট রিকোয়েস্ট (Deposit Requests)</h2>
            <div id="dep-list">কোনো পেন্ডিং ডিপোজিট নেই</div>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
            <h2>উইথড্র রিকোয়েস্ট (Withdraw Requests)</h2>
            <div id="with-list">কোনো পেন্ডিং উইথড্র নেই</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, runTransaction, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyTOnCm5IuPcB-yvGjFl3KbwRVxNrcNSY",
            authDomain: "ff-to-gaming-4ea1b.firebaseapp.com",
            databaseURL: "https://ff-to-gaming-4ea1b-default-rtdb.firebaseio.com",
            projectId: "ff-to-gaming-4ea1b",
            storageBucket: "ff-to-gaming-4ea1b.appspot.com",
            messagingSenderId: "816776130875",
            appId: "1:816776130875:web:c3e7984e0de53cbd89871e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const adminStatus = document.getElementById('admin-status');
        const forceCrashBtn = document.getElementById('force-crash-btn');

        // ইনস্ট্যান্ট ফোর্স ক্র্যাশ ট্রিগার
        forceCrashBtn.addEventListener('click', async () => {
            const now = Date.now();
            await set(ref(db, 'forceCrash'), {
                timestamp: now,
                triggered: true
            });
            adminStatus.innerText = "গেম ম্যানুয়ালি ক্র্যাশ করানো হয়েছে!";
            setTimeout(() => { adminStatus.innerText = "সার্ভার প্রস্তুত (অটো-লুপ সক্রিয়)"; }, 3000);
        });

        // Deposit Request Manager
        onValue(ref(db, 'depositRequests'), (snapshot) => {
            const depList = document.getElementById('dep-list');
            depList.innerHTML = '';
            const data = snapshot.val();
            if (!data) return depList.innerText = 'কোনো পেন্ডিং ডিপোজিট নেই';

            Object.keys(data).forEach(key => {
                const req = data[key];
                if (req.status === 'pending') {
                    const div = document.createElement('div');
                    div.className = 'req-item';
                    div.innerHTML = `
                        <div class="req-info">
                            <b>User:</b> ${req.email}<br>
                            <b>Amount:</b> ৳${req.amount} | <b>TrxID:</b> ${req.trxId}
                        </div>
                        <div>
                            <button class="btn btn-approve" onclick="approveDep('${key}', '${req.uid}', ${req.amount})">Approve</button>
                            <button class="btn btn-reject" onclick="rejectReq('depositRequests', '${key}')">Reject</button>
                        </div>
                    `;
                    depList.appendChild(div);
                }
            });
        });

        // Withdraw Request Manager
        onValue(ref(db, 'withdrawRequests'), (snapshot) => {
            const withList = document.getElementById('with-list');
            withList.innerHTML = '';
            const data = snapshot.val();
            if (!data) return withList.innerText = 'কোনো পেন্ডিং উইথড্র নেই';

            Object.keys(data).forEach(key => {
                const req = data[key];
                if (req.status === 'pending') {
                    const div = document.createElement('div');
                    div.className = 'req-item';
                    div.innerHTML = `
                        <div class="req-info">
                            <b>User:</b> ${req.email}<br>
                            <b>Amount:</b> ৳${req.amount} | <b>To:</b> ${req.receiver}
                        </div>
                        <div>
                            <button class="btn btn-approve" onclick="approveWith('${key}')">Approve Paid</button>
                            <button class="btn btn-reject" onclick="rejectWith('${key}', '${req.uid}', ${req.amount})">Refund & Reject</button>
                        </div>
                    `;
                    withList.appendChild(div);
                }
            });
        });

        window.approveDep = async (key, uid, amount) => {
            await runTransaction(ref(db, `users/${uid}/balance`), (b) => (b || 0) + amount);
            await remove(ref(db, `depositRequests/${key}`));
        };

        window.rejectReq = async (path, key) => {
            await remove(ref(db, `${path}/${key}`));
        };

        window.approveWith = async (key) => {
            await remove(ref(db, `withdrawRequests/${key}`));
        };

        window.rejectWith = async (key, uid, amount) => {
            await runTransaction(ref(db, `users/${uid}/balance`), (b) => (b || 0) + amount);
            await remove(ref(db, `withdrawRequests/${key}`));
        };
    </script>
</body>
</html>
