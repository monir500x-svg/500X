<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviator Pro Multiplayer</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.85);
            --accent-red: #e53935;
            --accent-green: #43a047;
            --accent-yellow: #fdd835;
            --text-color: #ffffff;
            --text-dim: #90a4ae;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        html, body { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }

        body { display: flex; flex-direction: column; justify-content: space-between; padding: 6px; }

        header {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 6px 10px;
            display: flex; justify-content: space-between; align-items: center;
            height: 42px; flex-shrink: 0;
        }

        .logo { font-size: 0.9rem; font-weight: bold; color: var(--accent-red); white-space: nowrap; }
        .user-info { display: flex; align-items: center; gap: 6px; }
        #user-email-display { font-size: 0.7rem; color: var(--text-dim); max-width: 85px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .balance-box { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--accent-green); border-radius: 5px; padding: 2px 6px; font-size: 0.75rem; }
        .balance-amount { color: var(--accent-green); font-weight: bold; }
        
        .btn { background: #1e88e5; color: white; border: none; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.75rem; }
        .btn-deposit { background: var(--accent-green); }
        .btn-withdraw { background: #fb8c00; }
        .btn-logout { background: #546e7a; }

        .container { 
            display: flex; flex-direction: column; gap: 6px; 
            flex: 1; margin-top: 6px; overflow: hidden; height: calc(100vh - 54px);
        }

        .glass-card { 
            background: var(--card-bg); 
            border: 1px solid var(--glass-border); 
            border-radius: 8px; padding: 6px; 
            display: flex; flex-direction: column; 
            height: 100%; overflow: hidden;
        }

        .history-bar {
            display: flex; gap: 4px; overflow-x: auto;
            padding-bottom: 4px; margin-bottom: 4px;
            scrollbar-width: none; flex-shrink: 0; height: 24px;
        }
        .history-bar::-webkit-scrollbar { display: none; }
        .history-item {
            background: rgba(0, 0, 0, 0.4); padding: 2px 6px;
            border-radius: 6px; font-size: 0.65rem; font-weight: bold;
            white-space: nowrap; border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; align-items: center;
        }
        .history-item.low { color: #00e5ff; }
        .history-item.mid { color: #c084fc; }
        .history-item.high { color: #ffd700; border-color: #ffd700; }

        .game-display {
            position: relative; 
            height: 42%; 
            width: 100%;
            background: radial-gradient(circle at bottom left, #1a233a 0%, #0b0e14 70%);
            border-radius: 6px; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .multiplier-text { font-size: 1.5rem; font-weight: 800; z-index: 2; text-shadow: 0 0 15px rgba(0, 0, 0, 0.8); text-align: center; }
        .multiplier-text.crashed { color: var(--accent-red); }

        .cashout-banner {
            position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: white; padding: 2px 10px; border-radius: 10px;
            font-size: 0.68rem; font-weight: bold; z-index: 10; white-space: nowrap;
        }

        .controls-panel { margin-top: 6px; display: flex; gap: 6px; align-items: flex-end; flex-shrink: 0; }
        .input-group { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .input-group label { font-size: 0.65rem; color: var(--text-dim); }
        .input-group input { background: rgba(0, 0, 0, 0.5); border: 1px solid var(--glass-border); color: white; padding: 6px; border-radius: 5px; font-size: 0.8rem; width: 100%; }

        .btn-action { height: 36px; font-size: 0.75rem; flex: 1.2; display: flex; align-items: center; justify-content: center; text-align: center; }
        .btn-bet { background: var(--accent-green); }
        .btn-cashout { background: var(--accent-yellow); color: #000; }
        .btn-waiting { background: #546e7a; cursor: not-allowed; }

        .live-bets-container {
            margin-top: 6px; flex: 1; background: rgba(0,0,0,0.3);
            border-radius: 6px; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .live-bets-header {
            background: rgba(255,255,255,0.03); padding: 4px 8px;
            font-size: 0.65rem; color: var(--text-dim); font-weight: bold;
            display: grid; grid-template-columns: 2fr 1fr 1fr; border-bottom: 1px solid var(--glass-border);
        }
        .live-bets-list { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .live-bets-list::-webkit-scrollbar { display: none; }
        .live-bet-row {
            display: grid; grid-template-columns: 2fr 1fr 1fr;
            padding: 5px 8px; font-size: 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.02);
            align-items: center; font-weight: 500;
        }
        .live-bet-row.cashed { background: rgba(67, 160, 71, 0.15); color: #81c784; }
        .live-bet-row.lost { background: rgba(229, 57, 53, 0.15); color: #ef9a9a; }
        .no-bet-text { text-align: center; padding: 10px; font-size: 0.7rem; color: var(--text-dim); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .hidden { display: none !important; }
        .modal { width: 90%; max-width: 320px; }
        .modal h2 { margin-bottom: 8px; font-size: 0.9rem; }
        .modal .form-group { margin-bottom: 6px; }
        .modal .form-group input { width: 100%; padding: 6px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; border-radius: 5px; font-size: 0.8rem; }
        .error-msg { color: var(--accent-red); font-size: 0.7rem; margin-top: 2px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">✈️ AVIATOR PRO</div>
        <div class="user-info">
            <span id="user-email-display"></span>
            <div class="balance-box">Bal: <span class="balance-amount" id="bal">৳ 0.00</span></div>
            <button class="btn btn-deposit" id="open-deposit-btn">DEP</button>
            <button class="btn btn-withdraw" id="open-withdraw-btn">WD</button>
            <button class="btn btn-logout" id="logout-btn">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="glass-card">
            <div class="history-bar" id="history-bar"></div>
            <div id="cashout-banner-container"></div>
            <div class="game-display">
                <canvas id="game-canvas"></canvas>
                <div class="multiplier-text" id="multiplier-display">WAITING...</div>
            </div>
            <div class="controls-panel">
                <div class="input-group">
                    <label>Bet Amount (৳)</label>
                    <input type="number" id="bet-amount" value="10" min="10" step="10">
                </div>
                <button class="btn btn-action btn-bet" id="bet-btn">BET NEXT ROUND</button>
            </div>

            <div class="live-bets-container">
                <div class="live-bets-header">
                    <span>User</span>
                    <span>Bet</span>
                    <span>Status / Win</span>
                </div>
                <div class="live-bets-list" id="live-bets-list">
                    <div class="no-bet-text">No active bet for this round</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="auth-modal">
        <div class="glass-card modal">
            <h2 id="auth-title">AVIATOR PRO LOGIN</h2>
            <form id="auth-form">
                <div class="form-group"><input type="email" id="auth-email" placeholder="Email" required></div>
                <div class="form-group"><input type="password" id="auth-password" placeholder="Password" required></div>
                <button type="submit" class="btn btn-deposit" style="width: 100%;" id="auth-submit-btn">Login</button>
                <div style="margin-top: 6px; font-size: 0.7rem; text-align: center;">
                    <a href="#" id="toggle-auth-mode" style="color: #64b5f6;">Create Account</a>
                </div>
                <div class="error-msg" id="auth-error"></div>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="deposit-modal">
        <div class="glass-card modal">
            <h2>Deposit Request</h2>
            <form id="deposit-form">
                <div class="form-group"><input type="number" id="dep-amount" placeholder="Amount (৳)" min="50" required></div>
                <div class="form-group"><input type="text" id="dep-trx" placeholder="TrxID (bKash/Nagad)" required></div>
                <div style="display: flex; gap: 6px;">
                    <button type="submit" class="btn btn-deposit" style="flex: 1;">Submit</button>
                    <button type="button" class="btn btn-logout" id="close-dep-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay hidden" id="withdraw-modal">
        <div class="glass-card modal">
            <h2>Withdraw Request</h2>
            <form id="withdraw-form">
                <div class="form-group"><input type="number" id="with-amount" placeholder="Amount (৳)" min="100" required></div>
                <div class="form-group"><input type="text" id="with-receiver" placeholder="Receiver Phone Number" required></div>
                <div style="display: flex; gap: 6px;">
                    <button type="submit" class="btn btn-withdraw" style="flex: 1;">Withdraw</button>
                    <button type="button" class="btn btn-logout" id="close-with-btn">Cancel</button>
                </div>
                <div class="error-msg" id="with-error"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, off, runTransaction, push, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyTOnCm5IuPcB-yvGjFl3KbwRVxNrcNSY",
            authDomain: "ff-to-gaming-4ea1b.firebaseapp.com",
            databaseURL: "https://ff-to-gaming-4ea1b-default-rtdb.firebaseio.com",
            projectId: "ff-to-gaming-4ea1b",
            storageBucket: "ff-to-gaming-4ea1b.appspot.com",
            messagingSenderId: "816776130875",
            appId: "1:816776130875:web:c3e7984e0de53cbd89871e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        setPersistence(auth, browserLocalPersistence);

        let currentUser = null;
        let userDbRef = null;
        let currentBalance = 0;
        let isSignUp = false;

        // গেম স্টেট ভেরিয়েবল
        let currentLocalMult = 1.00;
        let activeBet = 0;
        let betRoundIndex = -1; // রাউন্ড লক করার ভেরিয়েবল
        let hasCashedOut = false;
        let cashedMultiplier = 0;
        let cashedAmount = 0;
        let lastProcessedRound = -1;
        let isProcessingBet = false;

        let historyArray = [];

        const authModal = document.getElementById('auth-modal');
        const authForm = document.getElementById('auth-form');
        const authError = document.getElementById('auth-error');
        const toggleAuthMode = document.getElementById('toggle-auth-mode');
        const authTitle = document.getElementById('auth-title');
        const authSubmitBtn = document.getElementById('auth-submit-btn');

        const userEmailDisplay = document.getElementById('user-email-display');
        const balDisplay = document.getElementById('bal');

        const betBtn = document.getElementById('bet-btn');
        const betInput = document.getElementById('bet-amount');
        const multiplierDisplay = document.getElementById('multiplier-display');
        const cashoutBannerContainer = document.getElementById('cashout-banner-container');
        const historyBar = document.getElementById('history-bar');
        const liveBetsList = document.getElementById('live-bets-list');

        const depositModal = document.getElementById('deposit-modal');
        const withdrawModal = document.getElementById('withdraw-modal');

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() { 
            canvas.width = canvas.parentElement.clientWidth; 
            canvas.height = canvas.parentElement.clientHeight; 
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        toggleAuthMode.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUp = !isSignUp;
            authTitle.innerText = isSignUp ? "CREATE ACCOUNT" : "AVIATOR PRO LOGIN";
            authSubmitBtn.innerText = isSignUp ? "Sign Up" : "Login";
            toggleAuthMode.innerText = isSignUp ? "Already have an account? Login" : "Create Account";
            authError.innerText = "";
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.innerText = "Processing...";
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            try {
                if (isSignUp) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await set(ref(db, `users/${cred.user.uid}`), { email, balance: 500, games: 0, wins: 0, createdAt: Date.now() });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                authError.innerText = "";
            } catch (err) { 
                authError.innerText = err.message.replace("Firebase: ", ""); 
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.reload());
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authModal.classList.add('hidden');
                userEmailDisplay.innerText = user.email;

                if (userDbRef) off(userDbRef);
                userDbRef = ref(db, `users/${user.uid}`);

                onValue(userDbRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        currentBalance = data.balance || 0;
                        balDisplay.innerText = `৳ ${currentBalance.toFixed(2)}`;
                    } else {
                        update(ref(db, `users/${user.uid}`), { email: user.email, balance: 100, games: 0, wins: 0 });
                    }
                });
            } else {
                currentUser = null;
                authModal.classList.remove('hidden');
                balDisplay.innerText = "৳ 0.00";
            }
        });

        // ফিক্সড ডাইনামিক ক্র্যাশ পয়েন্ট অ্যালগরিদম
        function getDeterministicCrashPoint(roundIndex) {
            let hash = Math.sin(roundIndex * 12.9898 + 78.233) * 43758.5453;
            let rand = hash - Math.floor(hash);

            let crash = 1.00;
            if (rand < 0.10) crash = 1.00 + (rand * 1.2);
            else if (rand < 0.60) crash = 1.15 + ((rand - 0.10) / 0.50) * 0.85;
            else if (rand < 0.88) crash = 2.00 + ((rand - 0.60) / 0.28) * 3.00;
            else crash = 5.00 + ((rand - 0.88) / 0.12) * 20.00;

            return parseFloat(crash.toFixed(2));
        }

        // সময় থেকে মাল্টিপ্লায়ার বের করার একক ফর্মুলা (সমস্যা ফিক্স করার প্রধান লজিক)
        function calculateMultiplierFromTime(seconds) {
            return parseFloat((1.00 + Math.pow(seconds, 1.4) * 0.15).toFixed(2));
        }

        // মাল্টিপ্লায়ার থেকে সময় বের করার বিপরীত ফর্মুলা
        function calculateTimeFromMultiplier(mult) {
            if (mult <= 1.00) return 0;
            return Math.pow((mult - 1.00) / 0.15, 1 / 1.4);
        }

        function renderHistoryUI() {
            historyBar.innerHTML = '';
            historyArray.forEach(val => {
                let badge = document.createElement('div');
                badge.className = 'history-item';
                if (val < 2.00) badge.classList.add('low');
                else if (val < 10.00) badge.classList.add('mid');
                else badge.classList.add('high');
                badge.innerText = `${val.toFixed(2)}x`;
                historyBar.appendChild(badge);
            });
        }

        function renderMyLiveBetUI(currentRoundIndex, isCrashed = false) {
            const hasActiveBetThisRound = (betRoundIndex === currentRoundIndex);

            if (!hasActiveBetThisRound || !currentUser) {
                liveBetsList.innerHTML = `<div class="no-bet-text">No active bet for this round</div>`;
                return;
            }

            let nameDisplay = currentUser.email ? currentUser.email.split('@')[0] : 'You';
            let statusText = "";
            let rowClass = "live-bet-row";

            if (hasCashedOut) {
                statusText = `${cashedMultiplier.toFixed(2)}x (৳${cashedAmount.toFixed(2)})`;
                rowClass += " cashed";
            } else if (isCrashed) {
                statusText = "CRASHED (৳0.00)";
                rowClass += " lost";
            } else {
                let liveWin = (activeBet * currentLocalMult).toFixed(2);
                statusText = `In Flight (৳${liveWin})`;
            }

            liveBetsList.innerHTML = `
                <div class="${rowClass}">
                    <span>${nameDisplay} (You)</span>
                    <span>৳${activeBet}</span>
                    <span>${statusText}</span>
                </div>
            `;
        }

        // মাস্টার গেম লুপ
        function masterGameLoop() {
            const CYCLE_DURATION = 18000; // প্রতি রাউন্ডের মোট সময়
            const WAIT_DURATION = 3000;  // ওয়েটিং ফেজ ৩ সেকেন্ড

            const now = Date.now();
            const currentRoundIndex = Math.floor(now / CYCLE_DURATION);
            const cycleElapsed = now % CYCLE_DURATION;

            const targetCrashPoint = getDeterministicCrashPoint(currentRoundIndex);
            const totalFlightTimeNeeded = calculateTimeFromMultiplier(targetCrashPoint);

            // নতুন রাউন্ড শনাক্ত হলে রিসেট
            if (currentRoundIndex !== lastProcessedRound) {
                if (lastProcessedRound !== -1) {
                    let prevCrash = getDeterministicCrashPoint(lastProcessedRound);
                    historyArray.unshift(prevCrash);
                    if (historyArray.length > 15) historyArray.pop();
                    renderHistoryUI();
                } else {
                    for(let k = 3; k >= 1; k--) {
                        historyArray.push(getDeterministicCrashPoint(currentRoundIndex - k));
                    }
                    renderHistoryUI();
                }

                lastProcessedRound = currentRoundIndex;
                hasCashedOut = false;
                cashedMultiplier = 0;
                cashedAmount = 0;
                cashoutBannerContainer.innerHTML = '';
                
                if (betRoundIndex < currentRoundIndex) {
                    betRoundIndex = -1;
                    activeBet = 0;
                }
            }

            const isBetActiveForCurrentRound = (betRoundIndex === currentRoundIndex);

            // ১. WAITING PHASE
            if (cycleElapsed < WAIT_DURATION) {
                let waitLeft = Math.ceil((WAIT_DURATION - cycleElapsed) / 1000);
                multiplierDisplay.innerText = `NEXT ROUND IN ${waitLeft}s`;
                multiplierDisplay.classList.remove('crashed');
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                renderMyLiveBetUI(currentRoundIndex, false);

                if (isBetActiveForCurrentRound) {
                    betBtn.innerText = "BET PLACED";
                    betBtn.className = "btn btn-action btn-waiting";
                    betBtn.disabled = true;
                } else {
                    betBtn.innerText = isProcessingBet ? "PROCESSING..." : "BET NEXT ROUND";
                    betBtn.className = "btn btn-action btn-bet";
                    betBtn.disabled = isProcessingBet;
                }
            } 
            // ২. FLYING & CRASH PHASE
            else {
                let flyElapsed = (cycleElapsed - WAIT_DURATION) / 1000;

                // ক্র্যাশ পয়েন্ট এবং টাইমিং এর সিঙ্ক
                if (flyElapsed >= totalFlightTimeNeeded) {
                    currentLocalMult = targetCrashPoint;
                    multiplierDisplay.innerText = "FLEW AWAY!\n" + targetCrashPoint.toFixed(2) + "x";
                    multiplierDisplay.classList.add('crashed');

                    if (isBetActiveForCurrentRound && !hasCashedOut && currentUser) {
                        runTransaction(ref(db, `users/${currentUser.uid}/games`), (g) => (g || 0) + 1);
                    }

                    renderMyLiveBetUI(currentRoundIndex, true);

                    betBtn.innerText = "WAITING...";
                    betBtn.className = "btn btn-action btn-waiting";
                    betBtn.disabled = true;
                } 
                else {
                    currentLocalMult = calculateMultiplierFromTime(flyElapsed);
                    if (currentLocalMult > targetCrashPoint) currentLocalMult = targetCrashPoint;

                    multiplierDisplay.innerText = currentLocalMult.toFixed(2) + "x";
                    multiplierDisplay.classList.remove('crashed');

                    renderMyLiveBetUI(currentRoundIndex, false);
                    drawAviatorFlight(currentLocalMult, flyElapsed, totalFlightTimeNeeded);

                    if (isBetActiveForCurrentRound && !hasCashedOut) {
                        const liveWin = (activeBet * currentLocalMult).toFixed(2);
                        betBtn.innerText = `CASH OUT\n(৳${liveWin})`;
                        betBtn.className = "btn btn-action btn-cashout";
                        betBtn.disabled = false;
                    } else if (hasCashedOut) {
                        betBtn.innerText = `CASHED OUT\n(৳${cashedAmount.toFixed(2)})`;
                        betBtn.className = "btn btn-action btn-waiting";
                        betBtn.disabled = true;
                    } else {
                        betBtn.innerText = "BET NEXT ROUND";
                        betBtn.className = "btn btn-action btn-bet";
                        betBtn.disabled = false;
                    }
                }
            }

            requestAnimationFrame(masterGameLoop);
        }

        masterGameLoop();

        // বেট এবং ক্যাশআউট হ্যান্ডলার
        betBtn.addEventListener('click', async () => {
            if (!currentUser) return alert("Please Login First!");

            const CYCLE_DURATION = 18000;
            const WAIT_DURATION = 3000;
            const now = Date.now();
            const cycleElapsed = now % CYCLE_DURATION;
            const currentRoundIndex = Math.floor(now / CYCLE_DURATION);

            // ১. বেটিং লজিক
            if (cycleElapsed < WAIT_DURATION) {
                const targetRoundIndex = currentRoundIndex;

                if (betRoundIndex === targetRoundIndex) return;
                if (isProcessingBet) return;

                const betAmt = parseFloat(betInput.value);
                if (isNaN(betAmt) || betAmt < 10) return alert("Minimum Bet Amount is ৳10");
                if (betAmt > currentBalance) return alert("Insufficient Balance!");

                isProcessingBet = true;
                betBtn.innerText = "PROCESSING...";
                betBtn.disabled = true;

                try {
                    const userBalRef = ref(db, `users/${currentUser.uid}/balance`);
                    const txResult = await runTransaction(userBalRef, (current) => {
                        if (current >= betAmt) {
                            return current - betAmt;
                        }
                    });

                    if (txResult.committed) {
                        activeBet = betAmt;
                        betRoundIndex = targetRoundIndex;
                        hasCashedOut = false;
                        
                        betBtn.innerText = "BET PLACED";
                        betBtn.className = "btn btn-action btn-waiting";
                        betBtn.disabled = true;
                        renderMyLiveBetUI(targetRoundIndex, false);
                    } else {
                        alert("Transaction failed! Insufficient balance.");
                    }
                } catch (err) {
                    console.error("Bet Placement Error:", err);
                    alert("Error placing bet. Please try again.");
                } finally {
                    isProcessingBet = false;
                }
            } 
            // ২. ক্যাশআউট লজিক
            else if (cycleElapsed >= WAIT_DURATION && betRoundIndex === currentRoundIndex && !hasCashedOut) {
                const targetCrashPoint = getDeterministicCrashPoint(currentRoundIndex);
                const totalFlightTimeNeeded = calculateTimeFromMultiplier(targetCrashPoint);
                let flyElapsed = (cycleElapsed - WAIT_DURATION) / 1000;
                
                if (flyElapsed >= totalFlightTimeNeeded) return;

                hasCashedOut = true;
                cashedMultiplier = currentLocalMult;
                cashedAmount = activeBet * cashedMultiplier;

                betBtn.innerText = `CASHED OUT\n(৳${cashedAmount.toFixed(2)})`;
                betBtn.className = "btn btn-action btn-waiting";
                betBtn.disabled = true;

                await runTransaction(ref(db, `users/${currentUser.uid}/balance`), (b) => (b || 0) + cashedAmount);
                await runTransaction(ref(db, `users/${currentUser.uid}/wins`), (w) => (w || 0) + 1);
                await runTransaction(ref(db, `users/${currentUser.uid}/games`), (g) => (g || 0) + 1);

                cashoutBannerContainer.innerHTML = `<div class="cashout-banner">CASHED OUT ৳${cashedAmount.toFixed(2)} (${cashedMultiplier.toFixed(2)}x)</div>`;
                renderMyLiveBetUI(currentRoundIndex, false);
            }
        });

        // ক্যানভাস ডাইনামিক ড্রয়িং
        function drawAviatorFlight(mult, timeElapsed, totalDuration) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let flightProgress = Math.min(timeElapsed / Math.max(totalDuration, 1), 1.0);
            
            let targetX = canvas.width * 0.75;
            let targetY = canvas.height * 0.25;

            let finalX = targetX * flightProgress;
            let finalY = canvas.height - ((canvas.height - targetY) * flightProgress);

            if (flightProgress >= 1.0) {
                finalY += Math.sin(timeElapsed * 5) * 3;
            }

            let controlX = finalX * 0.4;
            let controlY = canvas.height;

            let fillGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            fillGradient.addColorStop(0, 'rgba(229, 57, 53, 0.45)');
            fillGradient.addColorStop(1, 'rgba(229, 57, 53, 0.00)');

            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.quadraticCurveTo(controlX, controlY, finalX, finalY);
            ctx.lineTo(finalX, canvas.height);
            ctx.closePath();
            ctx.fillStyle = fillGradient;
            ctx.fill();

            ctx.beginPath();
            ctx.strokeStyle = '#e53935';
            ctx.lineWidth = 3;
            ctx.moveTo(0, canvas.height);
            ctx.quadraticCurveTo(controlX, controlY, finalX, finalY);
            ctx.stroke();

            ctx.save();
            ctx.translate(finalX, finalY);
            ctx.rotate(-Math.PI / 10);

            ctx.fillStyle = "#e53935";
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(-16, -6); ctx.lineTo(-12, 0); ctx.lineTo(-16, 6);
            ctx.closePath(); ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(-4, 0, 2, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }

        // মোডাল হ্যান্ডলিং
        document.getElementById('open-deposit-btn').onclick = () => depositModal.classList.remove('hidden');
        document.getElementById('close-dep-btn').onclick = () => depositModal.classList.add('hidden');
        document.getElementById('open-withdraw-btn').onclick = () => withdrawModal.classList.remove('hidden');
        document.getElementById('close-with-btn').onclick = () => withdrawModal.classList.add('hidden');

        document.getElementById('deposit-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("Please login first");
            const amount = parseFloat(document.getElementById('dep-amount').value);
            const trxId = document.getElementById('dep-trx').value;
            try {
                await push(ref(db, 'depositRequests'), { uid: currentUser.uid, email: currentUser.email, amount, trxId, status: 'pending', createdAt: Date.now() });
                alert("Deposit request submitted!");
                depositModal.classList.add('hidden');
                document.getElementById('deposit-form').reset();
            } catch (err) { alert(err.message); }
        };

        document.getElementById('withdraw-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentUser) return alert("Please login first");
            const amount = parseFloat(document.getElementById('with-amount').value);
            const receiver = document.getElementById('with-receiver').value;
            const errorElem = document.getElementById('with-error');
            errorElem.innerText = "";

            if (isNaN(amount) || amount < 100) return errorElem.innerText = "Minimum withdraw amount is ৳100";
            if (amount > currentBalance) return errorElem.innerText = "Insufficient balance!";

            try {
                const userBalRef = ref(db, `users/${currentUser.uid}/balance`);
                const txResult = await runTransaction(userBalRef, (current) => {
                    if (current >= amount) return current - amount;
                });

                if (!txResult.committed) return errorElem.innerText = "Insufficient balance!";

                await push(ref(db, 'withdrawRequests'), { uid: currentUser.uid, email: currentUser.email, amount, receiver, status: 'pending', createdAt: Date.now() });
                alert(`Withdraw request submitted! ৳${amount.toFixed(2)} deducted.`);
                withdrawModal.classList.add('hidden');
                document.getElementById('withdraw-form').reset();
            } catch (err) { errorElem.innerText = err.message; }
        };
    </script>
