<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal - Login System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
        }

        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0369a1;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        /* Screen visibility handling */
        .hidden {
            display: none !important;
        }

        .portal-container {
            text-align: center;
        }

        .portal-container h1 {
            color: #4ade80;
            margin-bottom: 1rem;
        }

        .logout-btn {
            background: #dc2626;
            margin-top: 1.5rem;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <h2>গেম পোর্টাল লগইন</h2>
        <div id="error-message" class="error-msg">ইউজারনেম ও পাসওয়ার্ড দিন</div>
        
        <form id="login-form">
            <div class="input-group">
                <label for="username">ইউজারনেম</label>
                <input type="text" id="username" placeholder="যেকোনো নাম লিখুন" required>
            </div>
            
            <div class="input-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="******" required>
            </div>
            
            <button type="submit">লগইন করুন</button>
        </form>
    </div>

    <!-- 2. GAME PORTAL SCREEN -->
    <div id="portal-screen" class="card hidden">
        <div class="portal-container">
            <h1>স্বাগতম গেম পোর্টালে!</h1>
            <p>আপনার সেশন সফলভাবে সক্রিয় হয়েছে।</p>
            <p style="margin-top: 10px; color: #94a3b8;">User: <span id="user-display" style="color: #38bdf8;"></span></p>
            
            <button id="logout-btn" class="logout-btn">লগআউট</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const portalScreen = document.getElementById('portal-screen');
        const loginForm = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');

        // Page Load - Check Authentication State
        window.addEventListener('DOMContentLoaded', () => {
            checkAuthState();
        });

        // Function to check if user is logged in
        function checkAuthState() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const savedUser = localStorage.getItem('username');

            if (isLoggedIn === 'true' && savedUser) {
                // User is authenticated -> Show Portal, Hide Login
                userDisplay.textContent = savedUser;
                loginScreen.classList.add('hidden');
                portalScreen.classList.remove('hidden');
            } else {
                // User is NOT authenticated -> Show Login, Hide Portal
                loginScreen.classList.remove('hidden');
                portalScreen.classList.add('hidden');
            }
        }

        // Handle Login Form Submit
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Stop default form submit loop

            const username = usernameInput.value.trim();

            if (username !== '') {
                // Save session in LocalStorage
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);

                // Clear input
                usernameInput.value = '';

                // Update UI instantly without page refresh loop
                checkAuthState();
            }
        });

        // Handle Logout
        logoutBtn.addEventListener('click', () => {
            // Clear session
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');

            // Reset UI instantly
            checkAuthState();
        });
    </script>
</body>
</html>
